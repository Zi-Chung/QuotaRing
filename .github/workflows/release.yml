name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS Universal App
        env:
          QUOTARING_VERSION: ${{ github.ref_name }}
        run: |
          VER="${QUOTARING_VERSION#v}"
          QUOTARING_VERSION="$VER" bash apps/macos/build.sh --universal
          cd apps/macos/build
          ditto -c -k --sequesterRsrc --keepParent QuotaRing.app QuotaRing-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: apps/macos/build/QuotaRing-macOS-universal.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows Single-File EXE
        shell: pwsh
        run: |
          .\apps\windows\build.ps1
          Copy-Item apps\windows\publish\QuotaRing.exe apps\windows\publish\QuotaRing-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: apps/windows/publish/QuotaRing-win-x64.exe

  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build & Package Antigravity Plugin
        run: |
          cd plugin/quota-monitor
          npm install --no-audit --no-fund
          npm run build
          cd ..
          zip -r quota-monitor-plugin.zip quota-monitor -x "quota-monitor/node_modules/*"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: plugin/quota-monitor-plugin.zip

  publish-release:
    needs: [build-macos, build-windows, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/QuotaRing-macOS-universal.zip
            artifacts/QuotaRing-win-x64.exe
            artifacts/quota-monitor-plugin.zip
